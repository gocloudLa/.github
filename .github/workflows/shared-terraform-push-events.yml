name: "Shared Terraform Push Events"

on:
  workflow_call:
    inputs:
      foo:
        required: false
        type: string
        default: bar
      skip_release:
        required: false
        type: boolean
        default: false

concurrency:
  group: shared-terraform-push-events-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name == 'push'
    uses: gocloudLa/.github/.github/workflows/terraform-release.yml@main
    with:
      skip_execution: ${{ inputs.skip_release }}
    secrets: inherit