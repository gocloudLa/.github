name: "Shared Terraform Pull Request Events"

on:
  workflow_call:
    inputs:
      foo:
        required: false
        type: string
        default: bar
      skip_readme_generator:
        required: false
        type: boolean
        default: false

concurrency:
  group: shared-terraform-pull-request-events-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-validation:
    uses: gocloudLa/.github/.github/workflows/pull-request-validation.yml@feature/conditional-excecution
    secrets: inherit 

  terraform-validation:
    uses: gocloudLa/.github/.github/workflows/terraform-validation.yml@feature/conditional-excecution
    secrets: inherit

  readme-generator:
    uses: gocloudLa/.github/.github/workflows/terraform-readme-generator.yml@feature/conditional-excecution
    with:
      skip_execution: ${{ inputs.skip_readme_generator }}
    secrets: inherit

  workflow-summary:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [ pull-request-validation, terraform-validation, readme-generator ]
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'  # easier debug
          ! ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
