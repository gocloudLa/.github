name: "Shared Terraform Scheduled"

on:
  workflow_call:
    inputs:
      readme_yaml:
        required: false
        type: string
        default: README.yml
      output_path:
        required: false
        type: string
        default: README.md
      skip_readme_generator:
        required: false
        type: boolean
        default: false
      skip_maintenance:
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readme:
    uses: gocloudLa/.github/.github/workflows/terraform-readme-generator.yml@feature/conditional-excecution
    secrets: inherit 
    with:
      readme_yaml: ${{ inputs.readme_yaml }}
      output_path: ${{ inputs.output_path }}
      skip_execution: ${{ inputs.skip_readme_generator }}

  maintenance:
    uses: gocloudLa/.github/.github/workflows/terraform-maintenance.yml@feature/conditional-excecution
    with:
      skip_execution: ${{ inputs.skip_maintenance }}
    secrets: inherit